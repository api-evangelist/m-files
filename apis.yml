aid: m-files
name: M-Files
description: >-
  M-Files is a metadata-driven document and information management platform that connects
  documents to their business context, turning disconnected files into connected, trusted
  information. It provides AI-powered document management with built-in governance, workflow
  and document automation, and compliance, and integrates deeply with Microsoft 365. Trusted
  by 6,000+ organizations, M-Files exposes developer access through the M-Files Web Service
  (MFWS) REST API, a COM/.NET API, and the UIX and Vault Application Framework (VAF)
  extensibility frameworks. It was surfaced as a portfolio company of Partech.
