apis:
- name: M-Files Web Service (MFWS) REST API
  description: >-
    JSON over HTTPS REST API for the M-Files information management platform. Served per
    M-Files Server / Cloud vault under a /REST/ base path; supports objects, files, vaults,
    views, value lists, and search using standard GET/POST/PUT/DELETE verbs. Authenticated
    via an X-Authentication session token, OAuth 2.0 bearer, SSO, or pre-shared keys.
  humanURL: https://developer.m-files.com/APIs/REST-API/
